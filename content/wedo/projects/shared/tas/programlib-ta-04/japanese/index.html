<h2 id="__">プログラミングヘルプ</h2>
<div class="sectionbody">
<div class="paragraph">
<p>サウンドを録音するには、コントロールパネルのマイクのアイコンを押します。</p>
</div>
<div class="imageblock">
<div class="content">
<img src="../img/pl-04-img01.png" alt="pl 04 img01">
</div>
</div>
<div class="paragraph">
<p>録音したら、ウィンドウの調節ツールを使って録音を調節してオリジナルサウンドを作ります。</p>
</div>
<div class="imageblock">
<div class="content">
<img src="../img/pl-04-img02.png" alt="pl 04 img02">
</div>
</div>
<div class="paragraph">
<p>調節し終わったらそのサウンドを「サウンド番号0」として使用できます。別のサウンドを録音すると、新しいサウンドがその前に録音したサウンドに置き換わります。</p>
