<h2 id="__">使用记录工具</h2>
<div class="sectionbody">
<div class="paragraph">
<p>学生应花一些时间整理自己在整个实验过程中收集的信息。</p>
</div>
<div class="paragraph">
<p>根据您侧重的技能，可以让每个小组或每名学生提供以下一项或多项内容：</p>
</div>
<div class="ulist">
<ul>
<li>
<p>一份方案草图（分解）</p>
</li>
<li>
<p>一段机械手拿起和放下不同物体的视频（评估）</p>
</li>
<li>
<p>一段他们解释自己解决方案的视频（抽象化）</p>
</li>
<li>
<p>程序链的截屏（算法思维）</p>
</li>
<li>
<p>对程序的解释（算法思维）</p>
</li>
<li>
<p>他们在实验期间执行的一些测试的图片和解释（评估）</p>
</li>
</ul>
</div>
