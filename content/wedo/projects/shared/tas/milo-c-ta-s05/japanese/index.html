<h2 id="__">マイロをプログラミングしてマックスとミアにメッセージを送信</h2>
<div class="sectionbody">
<div class="paragraph">
<p>緑色の矢印をタップすると：</p>
</div>
<div class="paragraph">
<p>1.プログラムをスタートする<br>
2.チルトセンサーが下方向にかたむくのを待つ<br>
3.LEDライトをカラー9（赤）で点灯する<br>
4.ディスプレイにテキスト「  」を表示する<br>
5.チルトセンサーが上方向にかたむくのを待つ<br>
6.LEDライトをカラー0（無色）にして消灯する<br>
7.ディスプレイにテキスト「マイロ」を表示する<br>
8.ステップ2～7をずっと繰り返す</p>
</div>
