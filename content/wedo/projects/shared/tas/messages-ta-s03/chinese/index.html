<div class="sect1">
<h2 id="__">模型特征</h2>
<div class="sectionbody">
<div class="paragraph">
<p>学生要搭建一个使用倾斜传感器的操纵杆。倾斜传感器将探测操纵杆在什么位置倾斜。这些位置称为“模式”。  他们可以为每一个这样的模式设定不同的输出，例如播放声音或显示颜色。</p>
</div>
</div>
</div>
<div class="sect1">
<h2 id="___2">搭建一个使用倾斜传感器的操纵杆</h2>
<div class="sectionbody">
<div class="paragraph">
<p>倾斜传感器可以探测到六种不同的模式：</p>
</div>
<div class="ulist">
<ul>
<li>
<p>向彼侧倾斜</p>
</li>
<li>
<p>向此侧倾斜</p>
</li>
<li>
<p>向上倾斜</p>
</li>
<li>
<p>向下倾斜</p>
</li>
<li>
<p>不存在倾斜</p>
</li>
<li>
<p>震动</p>
</li>
</ul>
</div>
<div class="paragraph">
<p>在实验的第一部分，学生将用到三种模式：</p>
</div>
<div class="ulist">
<ul>
<li>
<p>向上倾斜，表示摩尔斯电码的短声</p>
</li>
<li>
<p>向下倾斜，表示摩尔斯电码的长声</p>
</li>
<li>
<p>无倾斜，没有声音</p>
</li>
</ul>
</div>
<div class="paragraph">
<p>在实验的第二部分，学生可以运用全部六种模式。</p>
</div>
