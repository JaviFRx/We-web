<h2 id="__">프로그래밍 도움말</h2>
<div class="sectionbody">
<div class="paragraph">
<p>활성화 문자를 변경하려면 블록을 길게 눌러 키보드 액세스를 활성화하십시오.</p>
</div>
<div class="paragraph">
<p>외부 키보드가 없는 태블릿의 경우, 문자열 중 하나를 터치하면 동일한 문자를 가진 모든 문자열이 동시에 시작됩니다.</p>
</div>
<div class="paragraph">
<p>외부 키보드가 있는 컴퓨터 또는 태블릿의 경우, 키보드에서 문자를 누르면 동일한 문자를 가진 모든 문자열이 동시에 시작됩니다.</p>
