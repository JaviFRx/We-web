<div class="paragraph">
<p>ライトブロックがプログラム文字列の最後に使用されると、LEDライトは少しの間だけ色がついてオンになります。これは、このブロックが文字列の最後に配置されていることが原因です。ソフトウェアはプログラム文字列の最後のブロックを実行しません。</p>
