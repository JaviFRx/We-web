<h2 id="__">编程帮助</h2>
<div class="sectionbody">
<div class="paragraph">
<p>如果在程序链的结尾使用“开灯程序块”，将以某种颜色短时间打开 LED 灯。这是因为它位于程序链的末尾，软件在程序链的末尾不会启动任何操作。</p>
</div>
<div class="paragraph">
<p>当没有可启动的操作时，程序会立即结束。</p>
