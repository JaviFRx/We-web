<div class="sectionbody">
<div class="paragraph">
<p>프로그래밍 문자열 끝에  조명 블록을 사용하면  LED가 잠깐동안 한 가지 색상으로 켜집니다. 그 이유는 해당 블록이 문자열 끝에 배치되었고 소프트웨어가 프로그램 문자열 끝 위치에서 아무 것도 활성화하지 않기 때문입니다.</p>
</div>

<p>더 실행할 것이 없을 경우 프로그램이 즉각 종료됩니다.</p>
