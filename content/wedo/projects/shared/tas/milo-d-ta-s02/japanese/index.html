<h2 id="__">マイロ輸送機器チームの組み立て</h2>
<div class="sectionbody">
<div class="paragraph">
<p>任務の最終段階となるこの課題では、チームをペアにして取り組みます。
2機の探査機を連結した運搬装置を、組み立てるよう伝えます。</p>
</div>
<div class="paragraph">
<p>以下のように課題を2つのチームに分けることができます。</p>
</div>
<div class="ulist">
<ul>
<li>
<p>Aチームが接続部分を組み立てる（ステップ2～8）</p>
</li>
<li>
<p>Bチームがそりを組み立てる（ステップ9～15）</p>
</li>
</ul>

<div class="sect1">
<h2 id="___2">組み立て用ヘルプ</h2>
<div class="sectionbody">
<div class="paragraph">
<p>チームが、単独で作業を行う場合、最大3台のスマートハブを、同一のデバイスに、接続できます。</p>
</div>
<div class="paragraph">
<p>ゴムバンドが付着していない車輪を取り外すと組み立てたモデルの操作性が高まります。</p>
