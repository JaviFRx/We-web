<h2 id="__">编程帮助</h2>
<div class="sectionbody">
<div class="paragraph">
<p>可以同时在智能集线器上连接两个传感器。但是在这种情况下，智能集线器将无法控制马达。</p>
</div>
<div class="paragraph">
<p>要同时控制更多传感器和马达，最多可在同一个设备上连接三个智能集线器。</p>
</div>
<div class="paragraph">
<p>要更改启动字母，可长按程序块进入键盘。</p>
</div>
<div class="paragraph">
<p>在不具备外部键盘的平板电脑上，当按下一个程序链时，所有具有相同字母的程序链都将同时启动。</p>
</div>
<div class="paragraph">
<p>在具备外部键盘的电脑或平板电脑上，当按下键盘上的一个字母时，所有包含这个字母的程序链都将同时启动。</p>
</div>
</div>
</div>
