<h2 id="__">ビデオを使ってトピックに親しむ</h2>
<div class="sectionbody">
<div class="paragraph">
<p>科学者やエンジニアは、遠く離れた場所を調査し、新しい発見をしようと長い間、挑戦を続けてきました。そうして開発されたのが、人間の代わりにこういった場所へ行き、データを収集してくれる宇宙船や探査機、衛星、ロボットです。</p>
</div>
<div class="paragraph">
<p>科学者たちは、これまでに数多くの成功をおさめ、また失敗も重ねてきました。失敗は新しいことを学ぶチャンスなのです。以下のアイデアを使って科学者のように考える練習を始めましょう。</p>
</div>
<div class="olist arabic">
<ol class="arabic">
<li>
<p>火星の調査には探査機が使われている。</p>
</li>
<li>
<p>水中調査には、潜水艦が使われている。</p>
</li>
<li>
<p>火山の調査には、ドローンが使われている。</p>
</li>
</ol>
