<h2 id="__">模型特征</h2>
<div class="sectionbody">
<div class="paragraph">
<p>学生要搭建一个可以行进和转向的机器人，然后为机器人编程，使其可以在平面上移动。</p>
</div>
<div class="paragraph">
<p>学生可以使用小的模块进行收集，或是自行搭建。</p>
</div>
<div class="imageblock">
<div class="content">
<img src="../img/moonbase-img04.png" alt="moonbase img04">
</div>
</div>
<div class="paragraph">
<p>学生搭建此模型时应注意的一些元素包括：</p>
</div>
<div class="ulist">
<ul>
<li>
<p>前轮胎要大于后轮胎</p>
</li>
<li>
<p>马达的电线不得对机构造成干扰</p>
</li>
<li>
<p>轮胎应正确安装到轮毂上</p>
<div class="imageblock">
<div class="content">
<img src="../img/moonbase-img04-0.png" alt="moonbase img04 0">
</div>
</div>
</li>
</ul>
</div>
</div>
</div>
<div class="sect1">
<h2 id="___2">小组搭建</h2>
<div class="sectionbody">
<div class="paragraph">
<p>如果有额外的设备，可以让小组中的每名学生搭建机器人的一部分，从而缩短搭建时间：</p>
</div>
<div class="ulist">
<ul>

<p>学生 A 可以进行第 1 步到第 23 步的搭建</p>

</li>
</ul>
