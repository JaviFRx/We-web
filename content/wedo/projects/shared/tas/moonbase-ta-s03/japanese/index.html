<div class="sectionbody">
<div class="paragraph">
<p>ロボットを組み立ててから、走って回るようにプログラミングします。</p>
</div>
<div class="paragraph">
<p>小さなパーツを複数使って組み立てるか、自分で組み立てます。</p>
</div>

</li>

</li>
<li>
<p>タイヤをハブに正確にはめこむ</p>

<h2 id="___2">チームでの組み立て（オプション）</h2>
<div class="sectionbody">
<div class="paragraph">
<p>余分にブロックがある場合、チームや各メンバーがロボットの一部を分担して組み立てれば、完成するまでにかかる時間を短縮できます。</p>
</div>
<div class="paragraph">
<p>（例） 子どもAはステップ1～23を組み立てる
