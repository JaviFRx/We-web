<h2 id="__">모델의 특성</h2>
<div class="sectionbody">
<div class="paragraph">
<p>학생들에게 물체를 잡고 들어올리고 옮길 수 있는 로봇 손을 만들게 하십시오. 로봇 손에는 물체와 탁자를 탐지하고 팔의 동작을 인지하기 위한 동작 센서가 장착됩니다.</p>
</div>
<div class="paragraph">
<p>학생들은 이 로봇 손을 이용해 작은 물체를 옮겨야 합니다. 첫 번째 과제는 꽃을 집어올려 탁자 위에 올리는 것입니다. 두 번째 과제는 전기 플러그를 소케트에 꽂는 것입니다. 또한 이러한 과제를 위해 사용할 물체를 학생들이 임의로 조립해도 상관없습니다.</p>
