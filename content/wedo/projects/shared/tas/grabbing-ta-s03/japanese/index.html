<h2 id="__">モデルの特徴</h2>
<div class="sectionbody">
<div class="paragraph">
<p>子どもたちは人工アームを組み立てて、物をつかみ、持ち上げ、置くといった動作をプログラミングします。手にはモーションセンサーが付属し、物、テーブル、腕の動きを検知するのに利用できます。</p>
</div>
<div class="paragraph">
<p>子どもたちは人工アームを使って、小さな物を動かします。最初の課題は花をつかんでテーブルの上に置くことです。2 番目の課題は、電子プラグをつかんでコンセントに差し込むことです。この 2 つの課題で使用する物を、自分たちで組み立てても良いです。</p>
